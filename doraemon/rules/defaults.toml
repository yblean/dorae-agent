# Built-in rules every user starts with.
# Your own corrections live in data/doraemon.db and win over these.
#
# Merchant and place names are matched on their core words: case, digits, punctuation
# and filler like "Singapore", "SG", "Pte", "Ltd" are ignored, and every word of the
# rule must appear in the name. "ntuc" matches "NTUC FP-BT BATOK EAST SINGAPORE SG".

