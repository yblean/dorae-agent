[project]
name = "doraemon"
version = "0.0.1"
description = "Turns an inbox into confirmed reminders, calendar events and a spending log."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "dateparser>=1.2",
    "tzdata",            # zoneinfo has no timezone database on Windows without this
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pypdf>=5",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doraemon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
