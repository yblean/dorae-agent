<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="640" height="640">
  <!-- Dorae, the app's mascot (collar, bell and pocket), in Telegram's blues and white: the Telegram bot's photo.
       Square and full-bleed: Telegram crops it to a circle. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4CC3F5"/><stop offset=".5" stop-color="#2AABEE"/><stop offset="1" stop-color="#1A8FD0"/>
    </linearGradient>
    <radialGradient id="belly" cx=".42" cy=".28" r=".8">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#F2F9FD"/><stop offset="1" stop-color="#CDE8F7"/>
    </radialGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6ECF8"/><stop offset=".25" stop-color="#F5FBFE"/><stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E96D9"/><stop offset=".45" stop-color="#0B7CC1"/><stop offset="1" stop-color="#075E96"/>
    </linearGradient>
    <radialGradient id="bell" cx=".34" cy=".28" r=".85">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#EAF6FD"/><stop offset=".85" stop-color="#A9D8F3"/><stop offset="1" stop-color="#6FB9E6"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".72">
      <stop offset=".72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#0B5E92" stop-opacity=".28"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.5"/></filter>
  </defs>
  <rect width="200" height="200" fill="url(#sky)"/>
  <ellipse cx="100" cy="156" rx="80" ry="74" fill="url(#belly)"/>
  <ellipse cx="100" cy="128" rx="58" ry="10" fill="#0B5E92" opacity=".16" filter="url(#soft)"/>
  <path d="M50 140 A50 42 0 0 0 150 140 Z" fill="url(#pocket)"/>
  <path d="M50 140 A50 42 0 0 0 150 140 Z" fill="none" stroke="#7FC3EC" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M56 143 H144" stroke="#5FB2E6" stroke-width="2" stroke-linecap="round" opacity=".5"/>
  <ellipse cx="100" cy="82" rx="110" ry="16" fill="#0B5E92" opacity=".3" filter="url(#soft)"/>
  <path d="M-6 40 Q100 84 206 40 L206 60 Q100 104 -6 60 Z" fill="url(#collar)"/>
  <path d="M-6 44 Q100 88 206 44" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity=".35"/>
  <ellipse cx="100" cy="124" rx="16" ry="5" fill="#0B5E92" opacity=".25" filter="url(#soft)"/>
  <rect x="95" y="76" width="10" height="9" rx="3" fill="#0B7CC1"/>
  <circle cx="100" cy="103" r="21" fill="url(#bell)" stroke="#0B7CC1" stroke-width="1.3"/>
  <path d="M79.5 97 Q100 104 120.5 97" fill="none" stroke="#0B7CC1" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M80 93 Q100 100 120 93" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
  <circle cx="100" cy="110" r="4.2" fill="#075E96"/>
  <path d="M100 113 V122" stroke="#075E96" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="92" cy="90" rx="6" ry="4" transform="rotate(-30 92 90)" fill="#FFFFFF" opacity=".9"/>
  <rect width="200" height="200" fill="url(#vignette)"/>
  <ellipse cx="58" cy="30" rx="38" ry="12" transform="rotate(-28 58 30)" fill="#FFFFFF" opacity=".28" filter="url(#soft)"/>
</svg>
